name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          
      - run: flutter pub get
      
      - name: Build iOS for simulator (no code signing)
        run: flutter build ios --release --no-codesign
      
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app